name: Benchmark

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, labeled]
  schedule:
    - cron: '35 17 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    name: Benchmark (Ubuntu)
    # 성능 확인이 필요한 PR 에만 performance 라벨로 요청한다.
    # 기본 브랜치 추세는 매일 측정하고, 수동 실행도 같은 보고서를 남긴다.
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'performance') &&
       (github.event.action != 'labeled' || github.event.label.name == 'performance'))
    runs-on: ubuntu-latest
    # 실행 대상인 job 만 이전 측정을 취소한다. 다른 라벨 추가는 영향을 주지 않는다.
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          cache-key: benchmark

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install benchmark dependencies
        uses: ./.github/actions/install-deps
        with:
          profile: benchmark

      - name: Build ZNTC (ReleaseFast)
        run: zig build -Doptimize=ReleaseFast

      - name: Build NAPI module
        run: zig build napi --cache-dir .zig-cache-napi

      - name: Build WASM module
        run: zig build wasm
        continue-on-error: true

      - name: Run CLI benchmark
        shell: bash
        run: |
          cd tests/benchmark
          # 회귀 보고서가 읽는 median ms JSON 과 사람이 읽는 표를 함께 남긴다.
          bun run bench.ts --json bench-results-ubuntu-latest.json 2>&1 | tee bench-output.txt

      - name: Run NAPI vs WASM vs CLI benchmark
        shell: bash
        run: |
          cd tests/benchmark
          bun run napi-bench.ts 2>&1 | tee -a bench-output.txt

      - name: Run bundle perf tool comparison
        # 같은 머신의 wall time 비교와 profile 진단이다. PR-base delta 는 아니다.
        shell: bash
        run: |
          cd tests/benchmark
          bun run bundle-perf.ts --output bundle-perf-ubuntu-latest.json 2>&1 | tee -a bench-output.txt

      - name: Regression report (soft, ratio vs baseline)
        id: gate
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          mkdir -p tests/benchmark
          GATE_FILE="tests/benchmark/benchmark-regression.md"
          # 보고서 실패는 성능 측정 결과 업로드를 막지 않는다.
          if ! bun run tests/benchmark/check-regression.ts \
              tests/benchmark/bench-results-ubuntu-latest.json --out "$GATE_FILE"; then
            echo "> 회귀 보고서를 생성하지 못했습니다. 실행 로그를 확인하세요." > "$GATE_FILE"
          fi
          echo "gate_file=$GATE_FILE" >> "$GITHUB_OUTPUT"

      - name: Write benchmark summary
        if: ${{ !cancelled() }}
        shell: bash
        env:
          GATE_FILE: ${{ steps.gate.outputs.gate_file }}
        run: |
          {
            echo "## Benchmark Results (Ubuntu)"
            echo ""
            echo "> CLI 회귀 보고서는 같은 실행의 esbuild/Bun 대비 비율을 기준으로 합니다."
            echo ""
            if [ -s "$GATE_FILE" ]; then
              cat "$GATE_FILE"
              echo ""
            fi
            echo "> bundle-perf 는 같은 실행의 ZNTC / Rolldown / Rspack wall time 비교입니다. PR-base delta 는 아닙니다."
            echo ""
            if [ -f tests/benchmark/bench-output.txt ]; then
              grep -E '^(\||###|$)' tests/benchmark/bench-output.txt || true
            else
              echo "측정 결과가 없습니다. 앞선 빌드/설치 단계의 로그를 확인하세요."
            fi
            echo ""
            echo "> Commit: $GITHUB_SHA / Event: $GITHUB_EVENT_NAME"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-ubuntu-latest
          path: |
            tests/benchmark/bench-output.txt
            tests/benchmark/bench-results-ubuntu-latest.json
            tests/benchmark/bundle-perf-ubuntu-latest.json
            tests/benchmark/benchmark-regression.md
