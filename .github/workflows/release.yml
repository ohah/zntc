name: Release

on:
  push:
    tags:
      - 'v*'
  # 빌드 설정(release.yml/build.zig)을 바꾸는 PR 은 9-플랫폼 NAPI/CLI 빌드만 돌려
  # cross-build 회귀를 tag push 전에 잡는다. publish/release 는 push 이벤트 전용이라 skip.
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - '.github/actions/setup-zig/**'
      - 'build.zig'
      - 'build.zig.zon'
  # default branch 에 이 트리거가 있어야 수동 실행 가능 (머지 후 임의 검증용).
  workflow_dispatch:

# PR 갱신만 이전 빌드를 취소한다. 태그/수동 실행은 run 별 그룹으로 배포를 보존한다.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# permissions:
#   contents: write   — github-release job (CLI binary tarball 업로드)
#   id-token: write   — publish-npm job (npm OIDC trusted publishing 준비)
# 첫 publish 는 NPM_TOKEN 으로. trusted publisher 등록 + NPM_TOKEN 삭제 후엔
# OIDC 만으로 동작 (--provenance 자동 부착).
permissions:
  contents: write
  id-token: write

jobs:
  # PLATFORMS in packages/core/src/platforms.ts 와 sync. 플랫폼마다 checkout/도구
  # 준비를 한 번 수행하고 npm NAPI 와 standalone CLI 산출물을 함께 만든다.
  build-platform:
    name: Build NAPI + CLI (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      # 한 플랫폼 실패로 나머지 빌드/진단 결과가 사라지지 않게 한다.
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64-gnu
            runner: ubuntu-latest
            zig_target: x86_64-linux-gnu
            cli_artifact: zntc-x86_64-linux-gnu
          - platform: linux-arm64-gnu
            runner: ubuntu-24.04-arm
            zig_target: aarch64-linux-gnu
            cli_artifact: zntc-aarch64-linux-gnu
          - platform: linux-x64-musl
            runner: ubuntu-latest
            zig_target: x86_64-linux-musl
            cli_artifact: zntc-x86_64-linux-musl
          - platform: linux-arm64-musl
            runner: ubuntu-24.04-arm
            zig_target: aarch64-linux-musl
            cli_artifact: zntc-aarch64-linux-musl
          - platform: darwin-x64
            runner: macos-15-intel
            zig_target: x86_64-macos
            cli_artifact: zntc-x86_64-macos
          - platform: darwin-arm64
            runner: macos-latest
            zig_target: aarch64-macos
            cli_artifact: zntc-aarch64-macos
          - platform: win32-x64-msvc
            runner: windows-latest
            zig_target: x86_64-windows-msvc
            cli_artifact: zntc-x86_64-windows
          # arm64-windows Zig 0.16.0 컴파일러가 native runner 에서 segfault.
          # x64 호스트에서 같은 aarch64-windows-msvc 타깃으로 cross-compile 한다.
          - platform: win32-arm64-msvc
            runner: windows-latest
            zig_target: aarch64-windows-msvc
            cli_artifact: zntc-aarch64-windows
          - platform: win32-ia32-msvc
            runner: windows-latest
            zig_target: x86-windows-msvc
            cli_artifact: zntc-x86-windows

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-zig
        with:
          version: 0.16.0
          cache-key: release-${{ matrix.zig_target }}

      # 명시적 macOS 타깃의 mimalloc 빌드에 시스템 CommonCrypto 헤더가 필요하다.
      - name: Setup macOS SDK
        if: runner.os == 'macOS'
        run: echo "SDKROOT=$(xcrun --show-sdk-path)" >> "$GITHUB_ENV"

      - name: Build NAPI (ReleaseFast)
        shell: bash
        run: zig build napi -Doptimize=ReleaseFast -Dtarget=${{ matrix.zig_target }}

      - name: Locate zntc.node
        id: locate
        shell: bash
        run: |
          if [ -f "zig-out/lib/zntc.node" ]; then
            echo "path=zig-out/lib/zntc.node" >> "$GITHUB_OUTPUT"
          elif [ -f "zig-out/bin/zntc.node" ]; then
            echo "path=zig-out/bin/zntc.node" >> "$GITHUB_OUTPUT"
          else
            echo "::error::zntc.node not found after zig build napi"
            exit 1
          fi

      - name: Upload zntc.node artifact
        uses: actions/upload-artifact@v4
        with:
          name: zntc-node-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 1
          path: ${{ steps.locate.outputs.path }}

      - name: Build CLI (ReleaseFast)
        run: zig build -Doptimize=ReleaseFast -Dtarget=${{ matrix.zig_target }}

      # NOTICE = BoringSSL Apache-2.0 §4(d) attribution. 별도 디렉터리에 실행파일과
      # NOTICE 만 모아 zig-out/bin 에 배치될 수 있는 NAPI 바이너리 혼입을 막는다.
      - name: Stage CLI artifact
        shell: bash
        run: |
          binary=zntc
          if [ "$RUNNER_OS" = "Windows" ]; then
            binary=zntc.exe
          fi
          mkdir -p cli-artifact
          cp "zig-out/bin/$binary" cli-artifact/
          cp NOTICE cli-artifact/

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.cli_artifact }}
          if-no-files-found: error
          retention-days: 1
          path: cli-artifact/

  # ─── npm publish (5 sub-package + main + 나머지) ───
  publish-npm:
    name: Publish to npm
    needs: build-platform
    # tag push 일 때만 실제 publish. workflow_dispatch(수동) 는 빌드 검증 전용.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      # `runs-on` 과 매칭 — 변경 시 함께 갱신. 사용처: "Place zntc.node in main package".
      MAIN_BUILD_NAPI_PLATFORM: linux-x64-gnu

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-zig
        with:
          version: 0.16.0
          # NAPI 는 artifact 를 사용하고, WASM 은 prepublishOnly hook 에서 빌드한다.
          cache-key: release-publish

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      # registry-url 을 지정하면 setup-node 가 NPM_CONFIG_USERCONFIG 를 $RUNNER_TEMP/.npmrc
      # 로 설정해, 아래 Publish step 이 $HOME/.npmrc 에 쓴 토큰을 npm 이 무시한다.
      # registry-url 생략 → npm 이 기본 $HOME/.npmrc 를 읽게 함.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install publish dependencies
        uses: ./.github/actions/install-deps
        with:
          profile: publish

      - name: Download all NAPI artifacts
        uses: actions/download-artifact@v4
        with:
          path: napi-artifacts/
          pattern: zntc-node-*

      # build-platform 매트릭스의 artifact 디렉토리 자체를 glob — platform 이름 hardcoded
      # 제거 (PLATFORMS 가 늘면 release.yml 매트릭스만 추가하면 자동 픽업).
      - name: Distribute zntc.node + NOTICE into platform sub-packages
        shell: bash
        run: |
          set -euo pipefail
          # NOTICE = BoringSSL Apache-2.0 §4(d) attribution. 각 sub-package files
          # 에 등록돼 있지만 root NOTICE 가 repo 에만 있어 publish 직전 cp 필요
          # (#2538 4-1 review follow-up).
          for dir in napi-artifacts/zntc-node-*/; do
            platform="${dir#napi-artifacts/zntc-node-}"
            platform="${platform%/}"
            src="${dir}zntc.node"
            dst="packages/core-${platform}/zntc.node"
            if [ ! -f "$src" ]; then
              echo "::error::missing artifact: $src"
              exit 1
            fi
            if [ ! -d "packages/core-${platform}" ]; then
              echo "::error::sub-package directory missing: packages/core-${platform}"
              exit 1
            fi
            cp "$src" "$dst"
            cp NOTICE "packages/core-${platform}/NOTICE"
            size=$(stat -c%s "$dst" 2>/dev/null || stat -f%z "$dst")
            echo "✓ ${dst} (${size} bytes) + NOTICE"
          done

      # main `@zntc/core` publish 의 prepublishOnly 가 build:js:cjs 단계에서
      # ZNTC self-host (`node bin/zntc.mjs --bundle ...`) 호출 — packages/core/zntc.node
      # 가 runner 환경에 있어야 동작. publish 산출물 자체에는 안 들어감 (main
      # 패키지의 `files` 필드에 zntc.node 미포함, sub-package 만 ship).
      - name: Place zntc.node in main package (build-time only)
        shell: bash
        run: |
          set -euo pipefail
          src="napi-artifacts/zntc-node-${MAIN_BUILD_NAPI_PLATFORM}/zntc.node"
          if [ ! -f "$src" ]; then
            echo "::error::missing artifact for main package build: $src"
            exit 1
          fi
          cp "$src" packages/core/zntc.node
          size=$(stat -c%s packages/core/zntc.node 2>/dev/null || stat -f%z packages/core/zntc.node)
          echo "✓ packages/core/zntc.node (${size} bytes) — prepublishOnly build"

      # dist-tag 자동 감지: v0.1.0 → latest, v0.1.0-rc.1 → rc, v0.1.0-beta.1 → beta
      - name: Determine npm dist-tag
        id: tag
        shell: bash
        run: |
          REF="${{ github.ref_name }}"
          VERSION="${REF#v}"
          if [[ "$VERSION" == *-* ]]; then
            PREID="${VERSION#*-}"
            DIST_TAG="${PREID%%.*}"
          else
            DIST_TAG="latest"
          fi
          echo "dist-tag=${DIST_TAG}" >> "$GITHUB_OUTPUT"
          echo "Will publish with --tag ${DIST_TAG}"

      # 인증: bun publish 는 각 패키지 cwd(packages/core-*)에서 실행되어 $HOME/.npmrc 를
      # 못 찾고 "missing authentication" 으로 실패한다. NPM_CONFIG_TOKEN 환경변수는 cwd 무관
      # 하게 인식되므로 이걸로 bun publish 를 인증한다(로컬 `bun pm whoami` 로 검증).
      # $HOME/.npmrc + npm whoami 는 16개 publish 전 인증 사전 검증용.
      - name: Publish via release.ts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > "$HOME/.npmrc"
          npm whoami
          bun scripts/release.ts --publish --yes --tag "${{ steps.tag.outputs.dist-tag }}"

  # ─── GitHub Release (CLI binary tarball) ───
  github-release:
    name: Create GitHub Release
    needs: [build-platform, publish-npm]
    # tag push 전용 — workflow_dispatch 검증 실행에서는 publish-npm 이 skip 되므로 함께 skip.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
          # CLI 이름은 x86/x86_64/aarch64 로 시작. npm 전용 zntc-node-* 제외.
          pattern: zntc-[ax]*

      - name: Create tarballs
        run: |
          cd artifacts
          for dir in zntc-*/; do
            name="${dir%/}"
            tar -czf "${name}.tar.gz" -C "$dir" .
          done

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/zntc-*.tar.gz

  # publish 직후 bun.lock 을 main 에 되돌린다.
  #
  # 왜 필요한가: `@zntc/core` 의 optionalDependencies 는 platform 바이너리 9개
  # (`@zntc/core-*`)를 **하드핀 버전**으로 가리키는데, 이 패키지들은 `workspaces` 밖이라
  # bun 이 npm 레지스트리에서 해석한다. 릴리스 시점엔 그 버전이 아직 npm 에 없어서
  # lockfile 에 안 들어가고, **publish 된 뒤에야** 해석 가능해진다. 그 순간부터
  # lockfile 이 stale 이 되어 이후 모든 PR 의 `bun install --frozen-lockfile` 이
  # "lockfile had changes, but lockfile is frozen" 으로 실패한다.
  #
  # v0.1.2 때 이 문제로 수습 커밋 3개가 필요했다. 자동화한다.
  #
  # (platform 패키지를 `workspaces` 에 넣으면 로컬 링크가 되어 근본 해결되지만,
  #  publint / publish-smoke 가 workspaces 를 훑어 publishable 패키지를 세는데
  #  이들은 `dist/` 없는 바이너리 전용이라 그 검증이 통째로 깨진다.)
  sync-lockfile:
    name: Sync bun.lock (post-publish)
    needs: publish-npm
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # main 은 보호 가지라 직접 push 가 막힌다(GH006: Changes must be made through
    # a pull request). 그래서 가지로 밀고 PR 을 연다 — PR 을 여는 데 필요한 권한.
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      # npm 이 방금 publish 된 버전을 색인하는 데 시간이 걸린다 — 아직 안 보이면
      # lockfile 이 그대로라 no-op 이 되고 다음 PR 에서 다시 터진다.
      # 플랫폼 9개를 **모두** 기다린다. 하나라도 아직 색인 전이면 그 항목이
      # 빠진 lockfile 이 만들어져, 이후 PR 의 `bun install --frozen-lockfile` 이
      # 그대로 깨진다(v0.1.6 때 win32-x64 하나가 빠져 실제로 그랬다).
      - name: Wait for npm to index the published version
        run: |
          VERSION="$(node -p "require('./packages/core/package.json').version")"
          PKGS="$(for d in packages/core-*/; do node -p "require('./${d}package.json').name"; done)"
          for pkg in $PKGS; do
            echo "waiting for ${pkg}@${VERSION} on npm…"
            ok=0
            for i in $(seq 1 30); do
              if npm view "${pkg}@${VERSION}" version >/dev/null 2>&1; then
                echo "  indexed after ${i} attempt(s)"
                ok=1
                break
              fi
              sleep 10
            done
            if [ "$ok" != 1 ]; then
              echo "::error::${pkg}@${VERSION} 이 5분 안에 npm 에 색인되지 않았다. bun.lock 을 수동으로 동기화해야 한다 (bun install && commit)."
              exit 1
            fi
          done

      - name: Resolve newly published platform packages into bun.lock
        run: bun install --no-frozen-lockfile

      # 가지로 밀고 PR 을 연다. main 직접 push 는 보호 규칙이 막는다
      # (v0.1.5 때 GH006 으로 이 잡이 실패했다 — publish 는 정상이었다).
      #
      # PR 생성은 저장소 설정 "Allow GitHub Actions to create and approve pull
      # requests" 가 켜져 있어야 된다. 꺼져 있으면 **이 잡을 실패시킨다** — 예전엔
      # 경고만 남기고 성공으로 끝냈는데, v0.1.7 때 그래서 브랜치만 고아로 남았고
      # 릴리스가 green 이라 아무도 모른 채 이후 모든 PR 의 CI 가 깨졌다(#4656).
      # lockfile stale 은 저장소 전체를 막으므로 조용히 지나가면 안 된다.
      - name: Open a PR with the lockfile change
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet bun.lock; then
            echo "bun.lock 변경 없음 — 할 일 없음."
            exit 0
          fi
          VERSION="$(node -p "require('./packages/core/package.json').version")"
          BRANCH="chore/bunlock-v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add bun.lock
          git commit -m "chore: bun.lock post-publish sync — v${VERSION} platform 바이너리 npm refs

          publish 직후 @zntc/core-*@${VERSION} 이 npm 에서 해석 가능해지면서 lockfile 에
          추가된다. 이걸 담아 두지 않으면 이후 모든 PR 의 bun install --frozen-lockfile 이
          실패한다. release.yml 의 sync-lockfile 잡이 자동 생성한 커밋."
          # --no-verify: 이 runner 엔 zig 가 없어 .githooks/pre-push 의 `zig fmt --check`
          # 가 "zig: not found" 로 실패해 push 가 막힌다(v0.1.4 때 이 동기화 커밋이 유실됨).
          # bun.lock 만 바꾸는 봇 커밋이라 훅 검증이 불필요.
          git push --no-verify -u origin "$BRANCH"
          if gh pr create --base main --head "$BRANCH" \
              --title "chore: bun.lock post-publish 동기화 (v${VERSION})" \
              --body "\`v${VERSION}\` publish 직후 \`@zntc/core-*@${VERSION}\` 이 npm 에서 해석되면서 lockfile 에 플랫폼 9개 항목이 붙는다. 담아 두지 않으면 이후 모든 PR 의 \`bun install --frozen-lockfile\` 이 깨진다.

          release.yml 의 sync-lockfile 잡이 연 PR 이다."; then
            echo "✓ PR 생성 완료"
            # 검사가 끝나면 알아서 들어가게 둔다 — lockfile 한 줄짜리 봇 PR 이라
            # 사람이 손댈 것이 없다.
            gh pr merge "$BRANCH" --rebase --auto \
              && echo "✓ 오토머지 걸어 둠" \
              || echo "::warning::오토머지를 걸지 못했다 — PR 은 열려 있으니 손으로 머지하면 된다(머지 전까지 다른 PR 의 frozen-lockfile 이 깨진다)."
          else
            # ⚠️ 여기서 실패를 **삼키면 안 된다**. v0.1.7 이 정확히 이래서 브랜치만 고아로
            # 남았고, 릴리스는 green 이라 아무도 몰랐다. 그 뒤 모든 PR 의 CI 가
            # `bun install --frozen-lockfile` 단계에서 죽었다(#4656 에서 수동 복구).
            #
            # lockfile 이 stale 이면 저장소 전체가 막히므로, 사람이 즉시 알아야 한다.
            # publish 자체는 이미 끝났으니 이 실패가 배포를 되돌리지는 않는다 — 남은
            # 후처리 한 단계를 손으로 해 달라는 신호다.
            echo "::error::bun.lock 동기화 PR 을 열지 못했다. **손으로 열어서 머지해야 한다** — 안 하면 이후 모든 PR 의 \`bun install --frozen-lockfile\` 이 깨진다."
            echo "::error::  https://github.com/${GITHUB_REPOSITORY}/compare/main...${BRANCH}?expand=1"
            echo "::error::  저장소 설정: Settings → Actions → General → 'Allow GitHub Actions to create and approve pull requests'"
            exit 1
          fi
