name: Integration & E2E

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'packages/**'
      - 'tests/**'
      - 'examples/web/**'
      - 'build/**'
      - 'build.zig'
      - 'build.zig.zon'
      - 'vendor/**'
      - 'package.json'
      - 'bun.lock'
      - 'bunfig.toml'
      - 'tsconfig*.json'
      - 'scripts/ci-install-deps.sh'
      - '.gitmodules'
      - '.github/workflows/integration.yml'
      - '.github/actions/**'
  pull_request:
    branches: [main]
    # draft PR 동안 무거운 잡 skip(아래 prepare-* 의 if). draft→ready 전환 시 다시 돌도록
    # ready_for_review 를 트리거 타입에 추가 — 기본 types(opened/synchronize/reopened)엔
    # 없어 누락 시 ready 후 CI 가 발화하지 않는다.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/**'
      - 'packages/**'
      - 'tests/**'
      - 'examples/web/**'
      - 'build/**'
      - 'build.zig'
      - 'build.zig.zon'
      - 'vendor/**'
      - 'package.json'
      - 'bun.lock'
      - 'bunfig.toml'
      - 'tsconfig*.json'
      - 'scripts/ci-install-deps.sh'
      - '.gitmodules'
      - '.github/workflows/integration.yml'
      - '.github/actions/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # 전체 통합·Hermes·compat·determinism은 Ubuntu에서 한 번 실행한다.
  # 별도 브라우저 E2E만 변경 영역에 따라 실행한다.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            e2e:
              - 'src/lexer/**'
              - 'src/parser/**'
              - 'src/semantic/**'
              - 'src/transformer/**'
              - 'src/codegen/**'
              - 'src/regexp/**'
              - 'src/transpile/**'
              - 'src/util/**'
              - 'src/cli/**'
              - 'src/*.zig'
              - 'build.zig'
              - 'build.zig.zon'
              - 'build/**'
              - 'vendor/**'
              - 'package.json'
              - 'bun.lock'
              - 'bunfig.toml'
              - 'tsconfig*.json'
              - 'scripts/ci-install-deps.sh'
              - '.gitmodules'
              - 'tests/**'
              - 'examples/web/**'
              - '.github/workflows/integration.yml'
              - '.github/actions/**'
              - 'src/bundler/**'
              - 'src/app/**'
              - 'src/server/**'
              - 'packages/core/**'
              - 'packages/shared/**'
              - 'packages/web/**'
              - 'packages/server/**'

  lint-format:
    name: Lint & Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        uses: ./.github/actions/install-deps
        with:
          profile: lint

      - name: Lint (oxlint)
        run: bun run lint

      - name: Format check (oxfmt)
        run: bun run fmt:check

  prepare-zntc-ubuntu:
    name: Prepare ZNTC (ubuntu-latest)
    runs-on: ubuntu-latest
    # draft PR 동안 skip — 의존 잡(integration-ubuntu/e2e/smoke)도
    # cascade skip. push(main) 에선 항상 실행.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: ./.github/actions/setup-zntc
        with:
          cpu: baseline
          install: "false"
          cache-key: zntc-ubuntu-baseline

      - name: Upload ZNTC build artifact
        uses: actions/upload-artifact@v4
        with:
          name: zntc-build-ubuntu-latest
          if-no-files-found: error
          retention-days: 1
          path: |
            zig-out/bin/zntc
            zig-out/lib/zntc.node
            packages/core/dist/**

  integration-ubuntu:
    name: Integration Tests (ubuntu-latest)
    runs-on: ubuntu-latest
    needs: prepare-zntc-ubuntu

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/use-zntc-artifact
        with:
          artifact-name: zntc-build-ubuntu-latest

      # using/SuppressedError fixture의 네이티브 런타임 오라클도 Node 24를 사용한다.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        uses: ./.github/actions/install-deps
        with:
          profile: integration

      # 통합 테스트 fixture 가 spawn 한 `zntc build` / `zntc dev` (app 모드) 가
      # `@zntc/web` 과 `@zntc/server` 를 lazy import. ZNTC artifact 는 core
      # build:js 까지만 — web/server 와 core dts 를 별도 빌드. (#2539 PR #6d 이후
      # web 의 tsc emit 가 core 의 `prepareAppDevSync` declaration 의존.)
      - name: Build @zntc/core dts + @zntc/server + @zntc/web (app 모드 의존)
        run: |
          bun run --cwd packages/core build:dts
          bun run --cwd packages/server build
          bun run --cwd packages/web build

      # emotion-v10 fixture 는 root workspace 미포함 — 격리 install 필요.
      - name: Install emotion v10 fixture deps
        run: cd tests/integration/fixtures/emotion-v10 && bun install --frozen-lockfile

      # 일반 discovery가 hermes-runtime.test.ts보다 es5-rn.test.ts를 먼저 실행한다는
      # 보장은 없다. RN fixture와 두 Hermes 바이너리를 미리 준비해 silent skip을 막는다.
      - name: Install RN example app dependencies
        run: cd tests/integration/tests/fixtures/rn-example-app && bun install --frozen-lockfile

      - name: Verify Linux Hermes runtime and bytecode compiler
        shell: bash
        run: |
          hermes="$PWD/node_modules/hermes-engine-cli/linux64-bin/hermes"
          hermesc="$PWD/tests/integration/tests/fixtures/rn-example-app/node_modules/hermes-compiler/hermesc/linux64-bin/hermesc"
          test -x "$hermes"
          test -x "$hermesc"
          probe_dir=$(mktemp -d)
          trap 'rm -rf "$probe_dir"' EXIT
          printf 'print("HERMES_READY");\n' > "$probe_dir/probe.js"
          test "$("$hermes" "$probe_dir/probe.js")" = 'HERMES_READY'
          "$hermesc" -emit-binary -out "$probe_dir/probe.hbc" "$probe_dir/probe.js"

      - name: Extract compat-table tests
        run: cd tests/integration && node tests/compat-table-extract.cjs > tests/fixtures/compat-table-tests.json

      - name: Run integration tests
        run: bun run test:integration

      - name: Upload compat-table report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compat-table-report
          path: tests/integration/compat-table-report.json

  integration-macos:
    name: macOS Watch, HMR & Native Smoke
    runs-on: macos-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: ./.github/actions/setup-zntc
        with:
          install: "false"
          cache-key: zntc-macos

      - name: Install dependencies
        uses: ./.github/actions/install-deps
        with:
          profile: integration

      # 통합 테스트 fixture 가 spawn 한 `zntc build` / `zntc dev` (app 모드) 가
      # `@zntc/web` 과 `@zntc/server` 를 lazy import. ZNTC artifact 는 core
      # build:js 까지만 — web/server 와 core dts 를 별도 빌드. (#2539 PR #6d 이후
      # web 의 tsc emit 가 core 의 `prepareAppDevSync` declaration 의존.)
      - name: Build @zntc/core dts + @zntc/server + @zntc/web (app 모드 의존)
        run: |
          bun run --cwd packages/core build:dts
          bun run --cwd packages/server build
          bun run --cwd packages/web build

      # macOS는 kqueue, native NAPI lifecycle, HTTP/TLS와 실제 watch/HMR 경로를 유지.
      # 전체 transpile/bundle/compat/determinism/RN 스위트는 Ubuntu가 담당한다.
      - name: Run macOS platform integration tests
        working-directory: tests/integration
        run: |
          bun test --timeout 10000 \
            ./tests/watch-json.test.ts \
            ./tests/watch-stress.test.ts \
            ./tests/hmr.test.ts \
            ./tests/devserver.test.ts \
            ./tests/devserver-sse.test.ts \
            ./tests/dev-server-tls.test.ts \
            ./tests/js-dev-server-lazy.test.ts \
            ./tests/napi-dev-jsx-binding.test.ts \
            ./tests/napi-dev-server.test.ts \
            ./tests/napi-dev-server-quiet-regression.test.ts \
            ./tests/napi-lazy-dev-hmr.test.ts \
            ./tests/napi-lazy-primitives.test.ts \
            ./tests/napi-tls-self-check.test.ts \
            ./tests/tsconfig-cache.test.ts

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [prepare-zntc-ubuntu, changes]
    # 브라우저 dev server 경로 — 코어 + bundler + dev server(src/app,server) + web 패키지
    # 변경 시. RN/Flow 전용 변경엔 skip.
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.e2e == 'true'

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/use-zntc-artifact
        with:
          artifact-name: zntc-build-ubuntu-latest

      - name: Install dependencies
        uses: ./.github/actions/install-deps
        with:
          profile: e2e

      # E2E test fixture 가 spawn 한 `zntc build` (app 모드) 가 `@zntc/web` 을
      # lazy import. ZNTC artifact 는 core build:js 까지만 — web/server 와 core
      # dts 를 별도 빌드 (#2539 PR #6d 후 web 의 tsc emit 가 core 의
      # `prepareAppDevSync` declaration 의존).
      - name: Build @zntc/core dts + @zntc/server + @zntc/web (E2E app 모드 의존)
        run: |
          bun run --cwd packages/core build:dts
          bun run --cwd packages/server build
          bun run --cwd packages/web build

      - name: Install Playwright browsers
        run: bun run playwright:install

      - name: Run E2E tests
        run: bun run test:e2e

  smoke:
    name: Smoke Tests (Real Projects)
    runs-on: ubuntu-latest
    needs: prepare-zntc-ubuntu

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/use-zntc-artifact
        with:
          artifact-name: zntc-build-ubuntu-latest
          napi: "false"

      - name: Install smoke dependencies
        uses: ./.github/actions/install-deps
        with:
          profile: benchmark

      - name: Run smoke tests
        shell: bash
        run: bun run tests/benchmark/smoke.ts 2>&1 | tee smoke-output.txt

      - name: Run smoke tests (--deep --minify-all)
        shell: bash
        # 30개 deepEntry fixture 를 minify 강제로 빌드+실행. minify codegen / mangler 회귀
        # (chalk 공백, mangler shadow, dead else, arrow obj body, new callee paren,
        # destructuring shorthand 등) 의 보호 — 이번 라운드에서 12개 PR 머지.
        run: |
          bun run tests/benchmark/smoke.ts --deep --minify-all \
            --filter=react,react-dom,vue,svelte,solid-js,preact,toolkit,mobx,zustand,jotai,immer,valtio,rxjs,tanstack-query,effect,lodash-es,date-fns,zod,dayjs,yaml,axios,express,hono,graphql,supabase,chalk,commander,yargs,three,d3 \
            2>&1 | tee smoke-deep-min-output.txt

      - name: Write smoke summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Smoke Test Results'
            for output in smoke-output.txt smoke-deep-min-output.txt; do
              echo ''
              if [ "$output" = smoke-output.txt ]; then
                echo '### Surface entry'
              else
                echo '### Deep entry + --minify-all'
              fi
              if [ -f "$output" ]; then
                grep -E '^(\||###|$)' "$output" || true
                echo ''
                tail -1 "$output"
              else
                echo 'No results: this test step did not complete.'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
