name: Test262 Conformance

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/test262'
      - 'tests/test262/**'
      - 'build/**'
      - 'build.zig'
      - 'build.zig.zon'
      - 'vendor/**'
      - '.gitmodules'
      - '.github/workflows/test262.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/test262'
      - 'tests/test262/**'
      - 'build/**'
      - 'build.zig'
      - 'build.zig.zon'
      - 'vendor/**'
      - '.gitmodules'
      - '.github/workflows/test262.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Runner unit tests는 CI Debug Test의 lib-unit-test에 포함된다.
  test262-parser:
    name: Test262 Language Conformance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          cache-key: test262-run

      # 전체 language/ 한 번에 — literals/comments/asi 등 (이전 별도 lexer job 의 모든
      # 카테고리) 이 이 디렉토리의 부분집합이라 단일 run 으로 동일 커버리지. 실패 시
      # 위반 파일 경로가 출력되므로 카테고리별 step 분리 없이도 회귀 위치 식별 가능.
      # 기존 corpus 실행과 동일한 Debug 모드로 한 번만 빌드한다.
      - name: Test262 — full language/
        run: zig build run -- --test262 tests/test262/test/language/

      - name: Summary
        run: echo "Full parser conformance results above"
